<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>São Paulo, Brazil | WDD 131</title>
  <meta name="description" content="WDD 131 country page assignment about São Paulo, Brazil, featuring responsive images, weather information, and dynamic JavaScript content.">
  <meta name="author" content="Werner Moecke">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <link rel="stylesheet" href="styles/place-large.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>São Paulo, Brazil</h1>
  </header>

  <main>
    <picture class="hero">
      <source srcset="images/sao-paulo-large.webp" media="(min-width: 700px)">
      <img src="images/sao-paulo-small.webp" alt="São Paulo skyline in Brazil" width="600" height="400">
    </picture>

    <section class="card data">
      <h2>Data</h2>
      <dl>
        <div>
          <dt>Area:</dt>
          <dd>1,521 km²</dd>
        </div>
        <div>
          <dt>Population:</dt>
          <dd>11.4 million</dd>
        </div>
        <div>
          <dt>Country:</dt>
          <dd>Brazil</dd>
        </div>
        <div>
          <dt>State:</dt>
          <dd>São Paulo</dd>
        </div>
        <div>
          <dt>Language:</dt>
          <dd>Portuguese</dd>
        </div>
        <div>
          <dt>Currency:</dt>
          <dd>Brazilian Real</dd>
        </div>
        <div>
          <dt>Time Zone:</dt>
          <dd>UTC-3</dd>
        </div>
        <div>
          <dt>Calling Code:</dt>
          <dd>+55</dd>
        </div>
      </dl>
    </section>

    <section class="card weather">
      <h2>Weather</h2>
      <img class="weather-icon" src="images/partly-cloudy.svg" alt="Partly cloudy weather icon" width="80" height="80">
      <dl>
        <div>
          <dt>Temperature:</dt>
          <dd><span id="temperature">9</span> °C</dd>
        </div>
        <div>
          <dt>Conditions:</dt>
          <dd>Partly Cloudy</dd>
        </div>
        <div>
          <dt>Wind:</dt>
          <dd><span id="wind-speed">13</span> km/h</dd>
        </div>
        <div>
          <dt>Wind Chill:</dt>
          <dd><span id="wind-chill"></span></dd>
        </div>
      </dl>
    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> | Werner Moecke | Brazil</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
