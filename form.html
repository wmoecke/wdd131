<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Review | WDD 131</title>

  <meta
    name="description"
    content="Submit a product review using the WDD 131 product review form."
  >
  <meta name="author" content="Werner Moecke">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <div class="form-group">
        <label for="product-name">
          Product Name
          <span class="required">*</span>
        </label>

        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>
          Overall Rating
          <span class="required">*</span>
        </legend>

        <div class="rating">
          <label for="rating-1">
            <span>☆</span>
            <input
              type="radio"
              id="rating-1"
              name="rating"
              value="1"
              required
            >
          </label>

          <label for="rating-2">
            <span>☆☆</span>
            <input
              type="radio"
              id="rating-2"
              name="rating"
              value="2"
              required
            >
          </label>

          <label for="rating-3">
            <span>☆☆☆</span>
            <input
              type="radio"
              id="rating-3"
              name="rating"
              value="3"
              required
            >
          </label>

          <label for="rating-4">
            <span>☆☆☆☆</span>
            <input
              type="radio"
              id="rating-4"
              name="rating"
              value="4"
              required
            >
          </label>

          <label for="rating-5">
            <span>☆☆☆☆☆</span>
            <input
              type="radio"
              id="rating-5"
              name="rating"
              value="5"
              required
            >
          </label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installation-date">
          Date of Installation
          <span class="required">*</span>
        </label>

        <input
          type="date"
          id="installation-date"
          name="installation-date"
          required
        >
      </div>

      <fieldset class="form-group">
        <legend>
          Which features did you find useful?
          <span class="optional">(Check all that apply)</span>
        </legend>

        <label class="checkbox-label" for="durability">
          <input
            type="checkbox"
            id="durability"
            name="useful-features"
            value="durability"
          >
          Durability
        </label>

        <label class="checkbox-label" for="ease-of-use">
          <input
            type="checkbox"
            id="ease-of-use"
            name="useful-features"
            value="ease-of-use"
          >
          Ease of Use
        </label>

        <label class="checkbox-label" for="performance">
          <input
            type="checkbox"
            id="performance"
            name="useful-features"
            value="performance"
          >
          Performance
        </label>

        <label class="checkbox-label" for="design">
          <input
            type="checkbox"
            id="design"
            name="useful-features"
            value="design"
          >
          Design
        </label>
      </fieldset>

      <div class="form-group">
        <label for="written-review">
          Written Review
          <span class="optional">(Optional)</span>
        </label>

        <textarea
          id="written-review"
          name="written-review"
          rows="6"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="user-name">
          Your Name
          <span class="optional">(Optional)</span>
        </label>

        <input
          type="text"
          id="user-name"
          name="user-name"
          autocomplete="name"
        >
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>
      &copy;<span id="currentyear"></span>
      | Werner Moecke | Brazil
    </p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
